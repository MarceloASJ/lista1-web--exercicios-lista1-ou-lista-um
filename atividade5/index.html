<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>Minhas Tarefas</h2>
        
        <div class="campo-tarefa">

        </div>

        <ul id="listaTarefas">
            <!-- As tarefas aparecerão aqui -->
        </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
