<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Tabuada Interativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>Tabuada Interativa</h2>
        
        <div class="campo">
            <label for="numero">Digite um número:</label>
            <input type="number" id="numero" placeholder="Ex: 7">
        </div>
        
        <div class="botoes">
            <button id="btnGerar">Gerar tabuada</button>
            <button id="btnLimpar" class="btn-secundario">Limpar</button>
        </div>

        <div id="resultado" class="resultado">
            <!-- A tabuada vai aparecer aqui -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
